        - heading "Indian restaurants deserve better technology." [level=1] [ref=e20]
        - paragraph [ref=e21]: Every day, thousands of restaurant owners across India manage their entire operation through WhatsApp groups, paper KOTs, and spreadsheets. Not because they want to — because the software available to them is too expensive, too complicated, or built for someone else entirely.
