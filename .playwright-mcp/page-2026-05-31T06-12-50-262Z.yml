        - heading "What We Built" [level=2] [ref=e23]
        - paragraph [ref=e24]: RestOS is a complete restaurant operating system — QR ordering, kitchen display, waiter app, payments, reservations, analytics — all connected, all in real time, all on devices you already own.
        - paragraph [ref=e25]: No expensive hardware. No complicated setup. No per-device fees. Software that works the way Indian restaurants actually work.
